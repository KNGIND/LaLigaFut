<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
  <meta name="theme-color" content="#08070f" id="theme-color-meta"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="La Súper Liga"/>
  <title>La Súper Liga</title>
  <link rel="manifest" id="manifest-link" href="manifest.json"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style-1.css"/>
  <style id="custom-css-tag"></style>
</head>
<body>

<div id="lock-screen"> ... <!-- same as before, truncated for brevity in file on purpose -->
</div>

<div id="login-screen" class="hidden"> ... </div>

<div id="app">
  <audio id="native-audio" preload="metadata"></audio>
  <div id="dynamic-island"> ... </div>

  <header id="hdr"> ... </header>

  <div class="pages">
    <div class="page active" id="pg-inicio"> ... </div>
    <div class="page" id="pg-partidos"> ... </div>

    <!-- LIGA page: added Champions of Cups section -->
    <div class="page" id="pg-info">
      <div class="pg-hdr">
        <div class="pg-hdr-title">Liga</div>
        <div class="pg-hdr-sub">Tabla, sanciones y reglamento</div>
      </div>
      <div class="sec" style="margin-top:8px">
        <div class="sec-hd"><div class="sec-title">Posiciones</div></div>
        <div class="stw">
          <table class="stt">
            <thead><tr>
              <th>#</th><th>Equipo</th>
              <th title="Partidos Jugados">PJ</th>
              <th title="Ganados">PG</th>
              <th title="Empates">PE</th>
              <th title="Perdidos">PP</th>
              <th title="Goles a Favor">GF</th>
              <th title="Goles en Contra">GC</th>
              <th title="Diferencia">DG</th>
              <th title="Puntos">Pts</th>
            </tr></thead>
            <tbody id="ftbody">
              <tr><td colspan="10">
                <div class="empty"><div class="etic">🏆</div><div class="etit">Sin datos</div></div>
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Campeones de Copas -->
      <div class="sec" style="margin-top:12px">
        <div class="sec-hd"><div class="sec-title">Campeones de Copas</div></div>
        <div class="cup-champs" id="cup-champs">
          <div class="empty"><div class="etic">🏆</div><div class="etit">No hay campeones todavía</div></div>
        </div>
      </div>

      <div class="sec" style="margin-top:16px"> ... sanciones, reglamento ... </div>

    </div>

    <div class="page" id="pg-perfil"> ... </div>
    <div class="page" id="pg-admin"> ... admin content ...</div>
  </div>

  <nav id="nav">
    <div class="nav-pill">
      <div id="nav-notch">
        <svg viewBox="0 0 72 28" fill="none" preserveAspectRatio="none">
          <path d="M0 0 Q36 0 36 28 Q36 0 72 0 L72 2 L0 2 Z" fill="#18171f" opacity="0.01"/>
          <path d="M0 2 Q18 2 24 10 Q30 18 36 18 Q42 18 48 10 Q54 2 72 2" fill="none"/>
        </svg>
      </div>
      <div id="nav-bubble">
        <svg id="nav-bubble-ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V21a1 1 0 01-1 1H15v-5h-6v5H4a1 1 0 01-1-1V9.5z"/>
        </svg>
      </div>

      <div class="ni on" id="ni-inicio" onclick="go('inicio')">
        <svg class="ni-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V21a1 1 0 01-1 1H15v-5h-6v5H4a1 1 0 01-1-1V9.5z"/>
        </svg>
        <span class="ni-lbl">Inicio</span>
      </div>
      <div class="ni" id="ni-partidos" onclick="go('partidos')">...</div>
      <div class="ni" id="ni-info" onclick="go('info')">...</div>
      <div class="ni" id="ni-perfil" onclick="go('perfil')">...</div>
      <div class="ni" id="ni-config" onclick="go('config-page')">...</div>
      <div class="ni" id="ni-admin" style="display:none" onclick="go('admin')">...</div>
    </div>
  </nav>

</div>

<!-- Overlays, modals and inputs remain (unchanged) -->

<div id="toast"></div>
<div id="sync-indicator">☁️</div>

<script src="script.js?v=7"></script>
</body>
</html>
