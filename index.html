<!-- Evita el "parpadeo" de tema/rendimiento antes de que cargue el JS -->
<script>
(function(){try{var p=JSON.parse(localStorage.getItem('lsl:prefs')||'{}'),d=document.documentElement;
if(p.mode==='light'||p.mode==='dark')d.setAttribute('data-theme',p.mode);
var m=navigator.deviceMemory,c=navigator.hardwareConcurrency;
d.setAttribute('data-perf',p.perf==='full'||p.perf==='lite'?p.perf:((m&&m<=4)||(c&&c<=4)?'lite':'full'));}catch(e){}})();
</script>

<header class="top" id="top"></header>

<!-- Ventanita de detalle (partido / noticia) -->

  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-t">

  </div>
</div>
