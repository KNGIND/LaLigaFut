name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Install Dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install @capacitor/push-notifications
        mkdir -p www && echo "index" > www/index.html

    - name: Configure Capacitor App Name and Credentials
      run: |
        npx cap init "LLF 2026" "com.lasuperliga.app" --web-dir=www
        npx cap add android

    - name: Configure Firebase Services
      run: |
        if [ -f google-services.json ]; then
          cp google-services.json android/app/google-services.json
        else
          echo "google-services.json no encontrado, se omitirá temporalmente"
        fi

    - name: Inject Custom App Icon (LLF 2026)
      run: |
        if [ -f icon.png ]; then
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
        fi

    - name: Override Capacitor Server Config
      run: |
        cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

    - name: Build Android Project
      run: |
        cd android
        sed -i 's/versionName "2.0"/versionName "26.06.20"/g' app/build.gradle
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
