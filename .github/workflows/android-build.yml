name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Install Dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install @capacitor/push-notifications
        mkdir -p www && echo "index" > www/index.html

    - name: Configure Capacitor App Name and Credentials
      run: |
        npx cap init "LLF 2026" "com.lasuperliga.app" --web-dir=www
        npx cap add android

    - name: Configure Firebase Services
      run: |
        if [ -f google-services.json ]; then
          cp google-services.json android/app/google-services.json
        else
          echo "google-services.json no encontrado, se omitirá temporalmente"
        fi

    - name: Inject Custom App Icon (LLF 2026)
      run: |
        # Buscamos icon.png o logo.png en tu raíz
        ICON_FILE=""
        if [ -f icon.png ]; then ICON_FILE="icon.png";
        elif [ -f logo.png ]; then ICON_FILE="logo.png"; fi

        if [ ! -z "$ICON_FILE" ]; then
          echo "¡Logo encontrado!: $ICON_FILE"
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          cp $ICON_FILE android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp $ICON_FILE android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp $ICON_FILE android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp $ICON_FILE android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp $ICON_FILE android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          cp $ICON_FILE android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp $ICON_FILE android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp $ICON_FILE android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp $ICON_FILE android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp $ICON_FILE android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
        else
          echo "⚠️ ADVERTENCIA: No se encontró icon.png ni logo.png en la raíz del proyecto."
        fi

    - name: Fix Permissions (Gallery & mixed content)
      run: |
        # Inyecta configuraciones de seguridad directo en el Manifest para permitir subir fotos
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        sed -i '/<\/application>/i \    <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" /></provider>' $MANIFEST_PATH
        
        # 🔥 ACÁ CORREGIMOS EL XML LIMPIO SIN LAS BARRAS REBELDES:
        mkdir -p android/app/src/main/res/xml
        echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/res/xml/file_paths.xml
        echo '<paths>' >> android/app/src/main/res/xml/file_paths.xml
        echo '    <external-path name="external_files" path="." />' >> android/app/src/main/res/xml/file_paths.xml
        echo '</paths>' >> android/app/src/main/res/xml/file_paths.xml

    - name: Override Capacitor Server Config
      run: |
        cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

    - name: Build Android Project & Set Version
      run: |
        cd android
        # 🔥 Forzamos el cambio directo sobre build.gradle tradicional de Capacitor
        sed -i 's/versionName "1.0"/versionName "26.06.21"/g' app/build.gradle
        sed -i 's/versionCode 1/versionCode 2/g' app/build.gradle
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk